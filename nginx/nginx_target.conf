# nginx_TCP_Proxy.conf
# (이 내용을 nginx_target.conf에 복사)

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# --- 1. TCP 프록시 (443 포트: TLS Passthrough + PROXY Protocol) ---
stream {
    server {
        listen 443;
        
        # Centre 서버의 443 포트(공유기 8888)로 연결
        proxy_pass 210.123.116.206:8888; 
        
        # [중요] V2.1 핵심: 원본 IP 보존을 위해 활성화 필수
        proxy_protocol on; 
        
        # [권장] ArgoCD/Jenkins 등 장시간 연결(Log streaming 등) 끊김 방지
        proxy_timeout 600s;
        proxy_connect_timeout 10s;
    }
}

# --- 2. HTTP (80 포트: ACME Challenge용 단순 전달) ---
# HTTP는 SSL이 없으므로 PROXY Protocol 없이 X-Forwarded-For 헤더로 충분함
http {
    server {
        listen 80;
        server_name _; 

        location / {
            # Centre 서버의 80 포트(공유기 8889)로 전달
            proxy_pass http://210.123.116.206:8889;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}